<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>종이 달력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{
  --desk:#d8dbd4; --paper:#fdfcf8; --ink:#25282d; --muted:#80838a; --line:#e3e0d6;
  --sun:#c2392b; --sat:#3a6ea5; --band:#27418f; --band-ink:#fff; --sel:#fff3c4; --hole:#d8dbd4; --ren:#fdeeea;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--desk:#15171a;--paper:#22252a;--ink:#ecebe5;--muted:#9a9da3;--line:#363a41;--sun:#ef7b6e;--sat:#7fb0e6;--band:#3a55b0;--sel:#4a4325;--hole:#15171a;--ren:#352a29}
}
:root[data-theme="dark"]{--desk:#15171a;--paper:#22252a;--ink:#ecebe5;--muted:#9a9da3;--line:#363a41;--sun:#ef7b6e;--sat:#7fb0e6;--band:#3a55b0;--sel:#4a4325;--hole:#15171a;--ren:#352a29}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:24px 14px 40px}
.wrap{max-width:820px;margin:0 auto;display:grid;gap:22px}
.sheet{background:var(--paper);border-radius:4px 4px 8px 8px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 14px 34px rgba(0,0,0,.18);overflow:hidden}
.binding{height:38px;background:radial-gradient(circle at 50% 52%,var(--hole) 0 6px,transparent 7px) 0 0/52px 38px repeat-x,var(--paper);border-bottom:1px solid var(--line)}
.head{background:var(--band);color:var(--band-ink);display:flex;align-items:flex-end;justify-content:space-between;padding:18px 22px 16px;gap:12px}
.ym small{display:block;font-size:15px;opacity:.8;letter-spacing:.08em}
.ym b{font:800 clamp(40px,9vw,60px)/1.05 'Nanum Myeongjo',Batang,serif}
.nav{display:flex;gap:6px}
.nav button{font:inherit;font-size:15px;color:inherit;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:6px;min-width:40px;height:40px;padding:0 12px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.26)}
button:focus-visible,.cell:focus-visible,textarea:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow div{text-align:center;padding:9px 0;font-size:13px;font-weight:500;border-bottom:1px solid var(--line);color:var(--muted)}
.dow div:first-child{color:var(--sun)}
.dow div:last-child{color:var(--sat)}
.cell{font:inherit;color:var(--ink);text-align:left;background:none;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:clamp(66px,13vw,108px);padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.cell:nth-child(7n){border-right:0}
.cell.empty{cursor:default;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px);opacity:.45}
.cell.ren{background:var(--ren)}
.cell.sel{background:var(--sel)}
.top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.n{font-size:15px;font-weight:500;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cell.c0 .n,.cell.hol .n{color:var(--sun)}
.cell.c6:not(.hol) .n{color:var(--sat)}
.cell.wk:not(.today).c0 .n,.cell.wk:not(.today).c6 .n{color:var(--ink)}
.cell.today .n{background:var(--band);color:#fff}
.lu{font-size:10.5px;color:var(--muted)}
.hn{font-size:11px;line-height:1.25;color:var(--sun);font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all}
.hn.a{color:var(--muted);font-weight:400}
.p{font-size:12px;line-height:1.35;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.cell.has::after{content:"";position:absolute;bottom:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--band)}
.foot{padding:14px 22px 18px;border-top:1px solid var(--line)}
.foot h3{margin:0 0 8px;font:800 17px/1.3 'Nanum Myeongjo',Batang,serif}
.li{display:flex;gap:10px;align-items:baseline;width:100%;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;border-bottom:1px dashed var(--line);padding:7px 2px;cursor:pointer;text-align:left}
.li:hover{background:var(--sel)}
.li .d{min-width:74px;color:var(--muted)}
.li.h .nm{color:var(--sun);font-weight:500}
.li.a .nm{color:var(--ink)}
.li.r .nm{color:var(--sun)}
.none{color:var(--muted);font-size:14px;margin:0}
.memo{background:var(--paper);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:20px 22px 18px;border-top:6px solid var(--band)}
.memo h2{margin:0 0 8px;font:800 24px/1.3 'Nanum Myeongjo',Batang,serif}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tag{font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.h{border-color:var(--sun);color:var(--sun)}
.dt{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.dt[hidden],.dt input[hidden]{display:none}
.dt label{display:flex;gap:6px;align-items:center;cursor:pointer}
.dt input[type=text]{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0;flex:1 1 140px}
.memo-body,textarea{display:block;width:100%;min-height:160px;font:inherit;font-size:16px;line-height:32px;color:var(--ink);background:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px) local;border:0;padding:0;margin:0}
.memo-body{white-space:pre-wrap;word-break:break-word}
.memo-body.none{color:var(--muted)}
textarea{resize:vertical;outline-offset:6px}
.actions{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.actions button{font:inherit;font-size:15px;font-weight:500;height:42px;padding:0 20px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.actions .primary{background:var(--band);border-color:var(--band);color:#fff}
.actions [hidden]{display:none}
#msg{font-size:14px;color:var(--muted)}
@media (max-width:560px){.p,.lu{display:none}.cell{padding:4px 3px}.hn{font-size:9.5px}.head{padding:14px 16px}.foot,.memo{padding-left:16px;padding-right:16px}}
@media (prefers-reduced-motion:no-preference){.memo{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="sheet">
    <div class="binding" aria-hidden="true"></div>
    <div class="head">
      <div class="ym"><small id="y"></small><b id="m"></b></div>
      <div class="nav">
        <button id="prev" aria-label="이전 달">◀</button>
        <button id="today">오늘</button>
        <button id="next" aria-label="다음 달">▶</button>
      </div>
    </div>
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
    <div class="foot"><h3 id="fh"></h3><div id="list"></div></div>
  </div>

  <section class="memo" id="memo" aria-live="polite">
    <h2 id="mTitle"></h2>
    <div class="tags" id="tags"></div>
    <div class="dt" id="dt" hidden>
      <label><input type="radio" name="dtype" value="base"><span id="dtBase"></span></label>
      <label><input type="radio" name="dtype" value="h">휴일</label>
      <label><input type="radio" name="dtype" value="w">평일</label>
      <input type="text" id="dtName" maxlength="20" placeholder="휴일 이름 (선택)" aria-label="휴일 이름" hidden>
    </div>
    <div class="memo-body" id="mBody"></div>
    <textarea id="mEdit" hidden aria-label="내용" placeholder="이 날의 일정이나 메모를 적어 보세요."></textarea>
    <div class="actions">
      <button id="bEdit">수정</button>
      <button id="bSave" class="primary" hidden>저장</button>
      <button id="bCancel" hidden>취소</button>
      <span id="msg"></span>
    </div>
  </section>
</div>
<script>
(function(){
var DAY=864e5,SEOUL='Asia/Seoul',lunFmt=null;
try{lunFmt=new Intl.DateTimeFormat('en-US-u-ca-chinese',{timeZone:SEOUL,month:'numeric',day:'numeric'})}catch(e){}
function p2(n){return n<10?'0'+n:''+n}
function U(y,m,d){return Date.UTC(y,m-1,d)}
function dow(ms){return new Date(ms).getUTCDay()}
function ymd(ms){var t=new Date(ms);return [t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()]}
function kk(ms){var a=ymd(ms);return a[0]+'-'+p2(a[1])+'-'+p2(a[2])}
function lunar(ms){
  if(!lunFmt)return null;
  var o={};lunFmt.formatToParts(new Date(ms+3*36e5)).forEach(function(x){o[x.type]=x.value});
  var m=parseInt(o.month,10),d=parseInt(o.day,10);
  if(isNaN(m)||isNaN(d))return null;
  return {m:m,d:d,leap:/\D/.test(o.month)};
}
var TEMP={'2024-04-10':'국회의원선거','2024-10-01':'국군의 날(임시공휴일)','2025-01-27':'임시공휴일','2025-06-03':'대통령선거','2026-06-03':'지방선거'};
var HC={};
function build(y){
  if(HC[y])return HC[y];
  var items=[],g={},H={};
  function add(ms,n,sub,blk,base){items.push({ms:ms,n:n,sub:!!sub,blk:!!blk,base:base||n})}
  [[1,1,'신정',0],[3,1,'삼일절',2021],[5,5,'어린이날',2014],[6,6,'현충일',0],[8,15,'광복절',2021],[10,3,'개천절',2021],[10,9,'한글날',2021],[12,25,'성탄절',2023]]
    .forEach(function(f){add(U(y,f[0],f[1]),f[2],f[3]&&y>=f[3])});
  if(y>=2026)add(U(y,7,17),'제헌절',false);
  var A={};
  function ann(ms,n){A[kk(ms)]=n}
  ann(U(y,4,5),'식목일');ann(U(y,5,1),'근로자의 날');ann(U(y,5,8),'어버이날');ann(U(y,5,15),'스승의 날');ann(U(y,5,21),'부부의 날');ann(U(y,10,1),'국군의 날');
  var d1=U(y,5,1);while(dow(d1)!==1)d1+=DAY;ann(d1+14*DAY,'성년의 날');
  for(var ms=U(y,1,1);ms<=U(y,12,31);ms+=DAY){
    var l=lunar(ms);if(!l||l.leap)continue;
    if(l.m===1&&l.d===1){add(ms-DAY,'설날 연휴',y>=2014,true,'설날');add(ms,'설날',y>=2014,true,'설날');add(ms+DAY,'설날 연휴',y>=2014,true,'설날')}
    else if(l.m===8&&l.d===15){add(ms-DAY,'추석 연휴',y>=2014,true,'추석');add(ms,'추석',y>=2014,true,'추석');add(ms+DAY,'추석 연휴',y>=2014,true,'추석')}
    else if(l.m===4&&l.d===8)add(ms,'부처님오신날',y>=2023);
    else if(l.m===1&&l.d===15)ann(ms,'정월대보름');
    else if(l.m===5&&l.d===5)ann(ms,'단오');
    else if(l.m===7&&l.d===7)ann(ms,'칠석');
  }
  Object.keys(TEMP).forEach(function(k){if(+k.slice(0,4)===y){var p=k.split('-');add(U(y,+p[1],+p[2]),TEMP[k],false)}});
  items.forEach(function(it){(g[it.ms]=g[it.ms]||[]).push(it)});
  var taken={};Object.keys(g).forEach(function(k){taken[k]=1});
  var req=[];
  Object.keys(g).map(Number).sort(function(a,b){return a-b}).forEach(function(ms){
    var G=g[ms],w=dow(ms);
    var hit=G.some(function(it){return it.sub&&!it.blk&&(w===0||w===6)})||G.some(function(it){return it.blk&&it.sub&&w===0})||(G.length>1&&G.some(function(it){return it.sub}));
    if(hit){var nm=[];G.forEach(function(it){if(it.sub&&nm.indexOf(it.base)<0)nm.push(it.base)});req.push({ms:ms,n:'대체공휴일('+nm.join('·')+')'})}
  });
  req.forEach(function(r){var c=r.ms+DAY;while(dow(c)===0||dow(c)===6||taken[c])c+=DAY;taken[c]=1;add(c,r.n,false);(g[c]=g[c]||[]).push(items[items.length-1])});
  Object.keys(g).forEach(function(k){
    var names=[];g[k].forEach(function(it){if(names.indexOf(it.n)<0)names.push(it.n)});
    var s=names.length===1&&/^대체/.test(names[0]);
    H[kk(+k)]={n:names.join('·'),t:s?'s':'h'};
  });
  Object.keys(A).forEach(function(k){if(!H[k])H[k]={n:A[k],t:'a'}});
  return HC[y]=H;
}
var OV={};
function baseInfo(ms){return build(ymd(ms)[0])[kk(ms)]||null}
function info(ms){var o=OV[kk(ms)];if(o&&o.t==='h')return {n:o.n||'휴일',t:'h',custom:1};if(o&&o.t==='w')return {n:'평일로 변경',t:'a',w:1};return baseInfo(ms)}
function isOff(ms){var i=info(ms);if(i&&i.w)return false;var w=dow(ms);if(w===0||w===6)return true;return !!(i&&i.t!=='a')}
function isHol(ms){var i=info(ms);return !!(i&&i.t!=='a')}
function run(ms){
  if(!isOff(ms))return null;
  var s=ms,e=ms,n=0;
  while(isOff(s-DAY)&&n++<20)s-=DAY;
  n=0;while(isOff(e+DAY)&&n++<20)e+=DAY;
  var len=(e-s)/DAY+1,h=false;
  for(var t=s;t<=e;t+=DAY)if(isHol(t))h=true;
  return len>=3&&h?{s:s,e:e,len:len}:null;
}

var KEY='paper-calendar-notes-v1',WD=['일','월','화','수','목','금','토'];
var notes={};
try{notes=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){notes={}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes));return true}catch(e){return false}}
try{OV=JSON.parse(localStorage.getItem('paper-calendar-days-v1')||'{}')||{}}catch(e){OV={}}
function persistDays(){try{localStorage.setItem('paper-calendar-days-v1',JSON.stringify(OV));return true}catch(e){return false}}
var now=new Date(),tms=U(now.getFullYear(),now.getMonth()+1,now.getDate()),todayKey=kk(tms);
var vy=now.getFullYear(),vm=now.getMonth(),sel=todayKey,editing=false;
var $=function(id){return document.getElementById(id)};
var grid=$('grid'),mBody=$('mBody'),mEdit=$('mEdit'),bEdit=$('bEdit'),bSave=$('bSave'),bCancel=$('bCancel'),msg=$('msg'),timer;
function parse(k){var p=k.split('-');return U(+p[0],+p[1],+p[2])}
function md(ms){var a=ymd(ms);return a[1]+'/'+a[2]+'('+WD[dow(ms)]+')'}
function lunTxt(ms){var l=lunar(ms);if(!l)return '';return l.d===1?(l.leap?'윤':'')+l.m+'.1':''+l.d}
function flash(t){msg.textContent=t;clearTimeout(timer);timer=setTimeout(function(){msg.textContent=''},2200)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function renderGrid(){
  $('y').textContent=vy+'년';$('m').textContent=(vm+1)+'월';
  grid.textContent='';
  var first=dow(U(vy,vm+1,1)),days=ymd(U(vy,vm+2,0))[2],total=Math.ceil((first+days)/7)*7;
  for(var i=0;i<total;i++){
    var d=i-first+1;
    if(d<1||d>days){grid.appendChild(el('div','cell empty'));continue}
    var ms=U(vy,vm+1,d),k=kk(ms),inf=info(ms),hol=!!(inf&&inf.t!=='a'),r=run(ms),txt=notes[k]||'';
    var b=el('button','cell c'+(i%7)+(hol?' hol':'')+(inf&&inf.w?' wk':'')+(r?' ren':'')+(k===todayKey?' today':'')+(k===sel?' sel':'')+(txt?' has':''));
    b.type='button';b.dataset.k=k;
    b.setAttribute('aria-label',(vm+1)+'월 '+d+'일'+(inf?', '+inf.n:'')+(txt?', 메모 있음':''));
    var top=el('div','top');top.appendChild(el('span','n',d));top.appendChild(el('span','lu',lunTxt(ms)));b.appendChild(top);
    if(inf)b.appendChild(el('span','hn'+(hol?'':' a'),inf.t==='s'?'대체공휴일':inf.w?'평일':inf.n));
    if(txt)b.appendChild(el('span','p',txt));
    grid.appendChild(b);
  }
  renderList(days);
}

function renderList(days){
  var L=$('list'),seen={},any=false;
  L.textContent='';$('fh').textContent=(vm+1)+'월 휴일과 기념일';
  for(var d=1;d<=days;d++){
    var ms=U(vy,vm+1,d),r=run(ms);
    if(r&&!seen[r.s]){seen[r.s]=1;any=true;
      var b=el('button','li r');b.type='button';b.dataset.k=kk(Math.max(r.s,U(vy,vm+1,1)));
      b.appendChild(el('span','d','연휴'));b.appendChild(el('span','nm',md(r.s)+' ~ '+md(r.e)+' · '+r.len+'일'));L.appendChild(b)}
  }
  for(d=1;d<=days;d++){
    ms=U(vy,vm+1,d);var inf=info(ms);if(!inf)continue;any=true;
    var li=el('button','li '+(inf.t==='a'?'a':'h'));li.type='button';li.dataset.k=kk(ms);
    li.appendChild(el('span','d',d+'일 ('+WD[dow(ms)]+')'));li.appendChild(el('span','nm',inf.n+(inf.t==='a'?'':'')));L.appendChild(li);
  }
  if(!any)L.appendChild(el('p','none','이번 달에는 공휴일이 없어요.'));
}

function renderMemo(){
  var ms=parse(sel),a=ymd(ms),inf=info(ms),r=run(ms),tags=$('tags'),l=lunar(ms);
  $('mTitle').textContent=(a[0]!==now.getFullYear()?a[0]+'년 ':'')+a[1]+'월 '+a[2]+'일 '+WD[dow(ms)]+'요일';
  tags.textContent='';
  if(inf)tags.appendChild(el('span','tag'+(inf.t==='a'?'':' h'),inf.n+(inf.custom?' (직접 지정)':'')));
  var bi=baseInfo(ms);if(inf&&inf.w&&bi&&bi.t!=='a')tags.appendChild(el('span','tag','원래: '+bi.n));
  if(r)tags.appendChild(el('span','tag h',r.len+'일 연휴 · '+md(r.s)+' ~ '+md(r.e)));
  if(l)tags.appendChild(el('span','tag','음력 '+(l.leap?'윤':'')+l.m+'월 '+l.d+'일'));
  var txt=notes[sel]||'';
  mBody.hidden=editing;mEdit.hidden=!editing;$('dt').hidden=!editing;
  bEdit.hidden=editing;bSave.hidden=!editing;bCancel.hidden=!editing;
  if(editing){mEdit.value=txt;fillDt(ms);mEdit.focus()}
  else{mBody.textContent=txt||'아직 적은 내용이 없어요. 수정을 눌러 추가해 보세요.';mBody.className='memo-body'+(txt?'':' none')}
}

function fillDt(ms){
  var o=OV[sel]||{},b=baseInfo(ms),w=dow(ms);
  var nm=b&&b.t!=='a'?b.n:(w===0||w===6?WD[w]+'요일':'평일');
  $('dtBase').textContent='원래대로 ('+nm+')';
  var v=o.t==='h'||o.t==='w'?o.t:'base';
  document.querySelector('input[name=dtype][value='+v+']').checked=true;
  $('dtName').value=o.t==='h'?(o.n||''):'';
  $('dtName').hidden=v!=='h';
}
function applyDt(){
  var ms=parse(sel),ch=document.querySelector('input[name=dtype]:checked').value,nm=$('dtName').value.trim();
  var b=baseInfo(ms),w=dow(ms),baseOff=w===0||w===6||!!(b&&b.t!=='a');
  if(ch==='h'){if(baseOff&&!nm)delete OV[sel];else OV[sel]={t:'h',n:nm}}
  else if(ch==='w'){if(!baseOff)delete OV[sel];else OV[sel]={t:'w'}}
  else delete OV[sel];
}
$('dt').addEventListener('change',function(){$('dtName').hidden=document.querySelector('input[name=dtype]:checked').value!=='h'});
function pick(k){
  sel=k;editing=false;msg.textContent='';
  var a=k.split('-');vy=+a[0];vm=+a[1]-1;
  renderGrid();renderMemo();
  var c=grid.querySelector('[data-k="'+k+'"]');if(c)c.focus();
}
grid.addEventListener('click',function(e){var c=e.target.closest('.cell');if(c&&c.dataset.k)pick(c.dataset.k)});
$('list').addEventListener('click',function(e){var c=e.target.closest('.li');if(c&&c.dataset.k)pick(c.dataset.k)});
bEdit.onclick=function(){editing=true;renderMemo()};
bCancel.onclick=function(){editing=false;renderMemo()};
bSave.onclick=function(){
  var v=mEdit.value.replace(/\s+$/,'');
  if(v)notes[sel]=v;else delete notes[sel];
  applyDt();var ok=persist()&&persistDays();
  editing=false;renderGrid();renderMemo();
  flash(ok?'저장했어요.':'이 브라우저에서는 저장할 수 없어요. 창을 닫으면 내용이 사라져요.');
};
function go(n){vm+=n;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}renderGrid()}
$('prev').onclick=function(){go(-1)};
$('next').onclick=function(){go(1)};
$('today').onclick=function(){pick(todayKey)};
renderGrid();renderMemo();
})();
</script>
</body>
</html>
